<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Login - Controle de Procedimentos
  </title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body class="login-page">

  <main class="login-container">

    <section class="login-card">

      <div class="login-header">

        <h1>
          Controle de Procedimentos
        </h1>

        <p>
          Acesse o sistema
        </p>

      </div>


      <form
        id="formLogin"
        class="login-form"
      >

        <div class="form-group">

          <label for="usuario">
            Usuário
          </label>

          <input
            type="text"
            id="usuario"
            name="usuario"
            autocomplete="username"
            required
          >

        </div>


        <div class="form-group">

          <label for="senha">
            Senha
          </label>

          <input
            type="password"
            id="senha"
            name="senha"
            autocomplete="current-password"
            required
          >

        </div>


        <div
          id="mensagemLogin"
          class="login-message"
        ></div>


        <button
          type="submit"
          id="btnEntrar"
          class="login-button"
        >
          Entrar
        </button>

      </form>

    </section>

  </main>


  <script src="/login.js"></script>

</body>

</html>
